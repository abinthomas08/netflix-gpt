name: react-gpt-check-out
on: push
jobs: 
    build-checkout-react: 
        runs-on: ubuntu-latest
        steps:
             - name:  checkout actions 
               uses: actions/checkout@v4
             
             - name: ls 
               run: ls -a 
             - name: install
               run: npm install
             - name: build
               run: npm build
